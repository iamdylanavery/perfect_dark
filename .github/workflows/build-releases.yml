name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - port-ext-hd-sound # Uncomment to auto-build on push for testing
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: perfect_dark_linux
            asset_name: perfect_dark-linux.tar.gz
          - os: windows-latest
            artifact_name: perfect_dark_windows
            asset_name: perfect_dark-windows.zip
          - os: macos-latest
            artifact_name: perfect_dark_macos
            asset_name: perfect_dark-macos.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- LINUX DEPENDENCIES ---
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev

      # --- MACOS DEPENDENCIES ---
      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install sdl2 cmake

      # --- WINDOWS DEPENDENCIES (MSYS2) ---
      - name: Install Windows MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf

      # --- COMPILATION STEP ---
      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake -G "MSYS Makefiles" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Mac and Linux)
        if: matrix.os != 'windows-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake --build build -j4

      - name: Build Binary (Mac and Linux)
        if: matrix.os != 'windows-latest'
        run: cmake --build build --config Release

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            perfect_dark_linux/perfect_dark-linux.tar.gz
            perfect_dark_windows/perfect_dark-windows.zip
            perfect_dark_macos/perfect_dark-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
