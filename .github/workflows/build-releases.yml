name: Build and Release

on:
  push:
    branches:
      - port-ext-hd-sound 
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: perfect_dark_linux
            asset_name: perfect_dark-linux.tar.gz
          - os: windows-latest
            artifact_name: perfect_dark_windows
            asset_name: perfect_dark-windows.zip
          - os: macos-latest
            artifact_name: perfect_dark_macos
            asset_name: perfect_dark-macos.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Ensures any N64/port submodules are checked out

      # --- LINUX DEPENDENCIES ---
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev

      # --- MACOS DEPENDENCIES ---
      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install sdl2 cmake

      # --- WINDOWS DEPENDENCIES ---
      - name: Install Windows SDL2
        if: matrix.os == 'windows-latest'
        uses: libsdl-org/setup-sdl@main
        with:
          version: 2-any

      # --- COMPILATION STEP ---
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TIME=Release

      - name: Build Binary
        run: cmake --build build --config Release

      # --- PACKAGING ---
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Grabs your compiled executable (adjust path/name to match your exact build output)
          Compress-Archive -Path build/Release/* -DestinationPath ${{ matrix.asset_name }}

      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Grabs your compiled Linux executable and assets
          tar -czvf ${{ matrix.asset_name }} -C build/ .

      - name: Package macOS Binary
        if: matrix.os == 'macos-latest'
        run: |
          # Grabs your compiled macOS executable/App bundle
          zip -r ${{ matrix.asset_name }} build/

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # Only runs if a tag was pushed
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            perfect_dark_linux/perfect_dark-linux.tar.gz
            perfect_dark_windows/perfect_dark-windows.zip
            perfect_dark_macos/perfect_dark-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
